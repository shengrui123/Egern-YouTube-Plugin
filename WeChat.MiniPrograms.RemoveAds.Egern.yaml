body_rewrites:
  # 上游 JSON 重写
  - response_jq:
      match: '(?i)^https://mcsp\.cloudpnr\.com/api/miniapp/popular/T_MINIAPP$'
      filter: '. as $original | if type == "object" then (try (del(.data)) catch $original) else . end'
  # 上游 JSON 重写
  - response_jq:
      match: '(?i)^https://saas-ad\.cloudpnr\.com/huifuad-base-api/api/tactics/ad$'
      filter: '. as $original | if type == "object" then (try (del(.data[0], .data[1], .data[2])) catch $original) else . end'
  # 上游 JSON 重写
  - response_jq:
      match: '(?i)^https://rms\.meituan\.com/api/v1/rmsmina/c/queryShopPortalInfo\?'
      filter: '. as $original | if type == "object" then (try (del(.data.popUpWindows)) catch $original) else . end'
  # 上游 JSON 重写
  - response_jq:
      match: '(?i)^https://chong\.qq\.com/tws/wxmobile/GetProduct4App\?'
      filter: '. as $original | if type == "object" then (try (del(.respInfo.reserveProductList) | .respInfo.shortcut |= map(select(.name != "充流量" and .name != "领话费券"))) catch $original) else . end'
  # 上游 JSON 重写
  - response_jq:
      match: '(?i)^https://chong\.qq\.com/tws/wxmobile4app/GetSecondProduct\?'
      filter: '. as $original | if type == "object" then (try (del(.respInfo.productList) | .respInfo.shortcut |= map(select(.name != "充流量" and .name != "领话费券"))) catch $original) else . end'
  # 上游 JSON 重写
  - response_jq:
      match: '(?i)^https://chong\.qq\.com/tws/usernumberinfo/GetUserInfo\?'
      filter: '. as $original | if type == "object" then (try (del(.data.request.number.markSeat.servicehallOperList, .data.request.number.servicehallOperList, .data.request.number.markSeat.servicehallFuncList, .data.request.number.servicehallFuncList)) catch $original) else . end'
  # 企迈点单系统去广告
  - response_jq:
      match: '(?i)^https://webapi\.qmai\.cn/web/catering/design/homePage-Config'
      filter: '. as $original | if type == "object" then (try (if (.data.config | type) == "string" then .data.config |= (fromjson | map(select(.id as $id | ["13502ede-f5fd-4d5c-90f5-f2454a30fda0", "c1caaf62-e91d-4040-b533-dab39c0fec13", "cc9d17ec-3ac5-494b-b82e-8d3c72c243d4", "7bef8fe9-0daf-46b3-a2b0-dd9fba49423f", "ff7e1263-d8d2-4f09-9947-d8c43c77bb10", "874197b4-fe93-4a80-a555-8df1bc7e8211", "0ba6a615-b7e9-48aa-afe7-329635385f2c", "a11b0e7d-a162-4802-ac71-21d98e8adddf"] | all(.[]; . as $blocked | $id | contains($blocked) | not))) | tojson) else . end) catch $original) else . end'
  # EMS中国邮政物流速递去广告
  - response_jq:
      match: '(?i)^https://ump\.ems\.com\.cn/new-generation-extend/redis/pageInfoByChannel'
      filter: '. as $original | if type == "object" then (try (if (.info.moduleJson | type) == "string" then .info.moduleJson |= (fromjson | map(select(.moduleName | contains("广告") | not)) | tojson) else . end) catch $original) else . end'
  # 小兔充充去广告
  - response_jq:
      match: '(?i)^https://mapi\.xiaotucc\.com/mall/main'
      filter: '. as $original | if type == "object" then (try (del(.data)) catch $original) else . end'
  # 小兔充充去广告
  - response_jq:
      match: '(?i)^https://mapi\.xiaotucc\.com/main_page/index/getActivity'
      filter: '. as $original | if type == "object" then (try (del(.data.p3)) catch $original) else . end'
  # 全家微会员去广告
  - response_jq:
      match: '(?i)^https://minifm\.maxxipoint\.com/banner/list'
      filter: '. as $original | if type == "object" then (try (del(.data.topBanner)) catch $original) else . end'
  # 罗森点点去广告
  - response_jq:
      match: '(?i)^https://lawsonapi\.yorentown\.com/area/sh-lawson/app/v1/home'
      filter: '. as $original | if type == "object" then (try (del(.data.homeButtonList, .data.dysmorphismPictureList)) catch $original) else . end'
  # 茶颜悦色去广告
  - response_jq:
      match: '(?i)^https://miniapp\.sexytea2013\.com/cms/slot/queryByCodes\?codes=INDEX_TOP_BANNER'
      filter: '. as $original | if type == "object" then (try (del(.data.INDEX_SLOT_01, .data.INDEX_SLOT_02) | if (.data.INDEX_TOP_BANNER.contents | type) == "array" then .data.INDEX_TOP_BANNER.contents |= map(del(.bubble, .figure) | .value = "https://kelee.one/Resource/Script/WexinMiniPrograms/chayanyuese/cyys1.jpg") else . end) catch $original) else . end'
  # COCO点单去广告
  - response_jq:
      match: '(?i)^https://coco-com\.e\.verystar\.net/v1/home/info'
      filter: '. as $original | if type == "object" then (try (del(.data.top_background_url, .data.bottom_banner_list)) catch $original) else . end'
  # 滴滴青桔去广告
