      match: '(?i)^https://htwkop\.xiaojukeji\.com/gateway\?api=hm\.fa\.homeConfig'
      filter: '. as $original | if type == "object" then (try (del(.data.bannerInfoConfig)) catch $original) else . end'
  # 一点点+去广告
