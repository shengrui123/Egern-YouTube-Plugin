      match: '(?i)^https://passenger\.t3go\.cn/(solution\-|common\-)?(passenger\-)?(activity\-|app\-)?api/notoken/(trip/)?api/(home/|common/)?(v[1-3]/)?(ad/getNegativescreen|solution/passenger/open/getHomeMenu|leftmenu|getHomeInfoGlobal)'
      filter: '. as $original | if type == "object" then (try (del(.data)) catch $original) else . end'
  # 古茗去广告
