      match: '(?i)^https://cappapi\.alittle-tea\.com/open\?method=catering\.set\.ad'
      filter: '. as $original | if type == "object" then (try (del(.data)) catch $original) else . end'
  # M Stand去广告
  - response_jq:
      match: '(?i)^https://api\.prod\.dj\.mstand\.cn/scrm/mini/app/index/info'
      filter: '. as $original | if type == "object" then (try (del(.data.homeNewsAdv.jumpValue, .data.homeDineInAdv, .data.homePickupAdv, .data.nearbyShopInfo, .data.homeEventThemesAdv, .data.eventThemes, .data.homeRootAdv, .data.homeTopAdv, .data.homeDialogAdv, .data.homeBannerAdv, .data.homeCouponAdv, .data.homeCompanyAdv, .data.homeDeliveryAdv)) catch $original) else . end'
  # T3出行去广告
