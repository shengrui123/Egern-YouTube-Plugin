name: 中国移动去广告 · Yuheng
description: v3 · Yuheng 加密响应适配版。解密并清理开屏、首页和弹窗广告后重新加密。需开启 HTTPS 解密并完全信任 Egern CA；尚未在中国移动 12.5.7 真机验证。
author: Yuheng0101；shengrui123（Egern 适配）
homepage: https://github.com/shengrui123/Egern-YouTube-Plugin
icon: https://raw.githubusercontent.com/luestr/IconResource/173d41fe13f74590ab9449ee1ae1feb7be2f2b5b/App_icon/120px/ChinaMobile.png
# 固定上游快照，保留原作者声明；不在运行时下载或执行新的上游代码。
# https://github.com/Yuheng0101/X/blob/main/Scripts/ChinaMobile/NoAds.js
# 勿与返回空启动响应的旧规则并用，否则响应脚本无法获得真实加密数据。
url_rewrites:
  - match: '^https?://h\.app\.coc\.10086\.cn/biz-orange/DH/popupWindow/getDetail/?(?:\?.*)?$'
    location: http://reject-200/
scriptings:
  - http_response:
      name: 中国移动 Yuheng 加密响应净化
      match: '^https?://(?:client\.app\.coc\.10086\.cn/biz-orange/DN/(?:init/startInit|newTopPullSecond/getNewTopPullList|emotionMarket/getEmotionMarketNew|friendShake/getShakeList)|h\.app\.coc\.10086\.cn/biz-orange/DH/(?:homeArea/getTopAreaList|navigation/getNavigationNewInfo))/?(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/shengrui123/Egern-YouTube-Plugin/main/scripts/chinamobile.yuheng.response.js
      body_required: true
      max_size: 4194304
      timeout: 15
      update_interval: 86400
mitm:
  hostnames:
    includes:
      - client.app.coc.10086.cn
      - h.app.coc.10086.cn
