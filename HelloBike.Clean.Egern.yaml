name: 哈啰净化 · ZenmoFeiShi
description: 完整适配 helloobike.snippet 2026-11-06，净化广告、推荐流、借钱入口、我的页与车主会员推广。动态密钥仅本机保存；需信任 Egern CA，尚未真机验证。
author: TG@ZenMoFiShi；shengrui123（Egern 适配）
homepage: https://github.com/shengrui123/Egern-YouTube-Plugin
# Source: https://github.com/ZenmoFeiShi/Qx/blob/main/helloobike.snippet
url_rewrites:
  - match: '^https?:\/\/api-htp\.beizi\.biz\/mb\/sdk0\/json(?:\?|$)'
    location: http://reject-200/
  - match: '^https?:\/\/adservice\.sigmob\.cn\/(?:hb\/v2\/ad|ad\/v4)(?:\?|$)'
    location: http://reject-200/
  - match: '^https?:\/\/tm\.sigmob\.cn\/(?:waterfall\/v1|strategy\/v6)(?:\?|$)'
    location: http://reject-200/
  - match: '^https?:\/\/(?:mi|v2mi)\.gdt\.qq\.com\/(?:gdt_mview\.fcg|server_bidding2)(?:\?|$)'
    location: http://reject-200/
scriptings:
  - http_request:
      name: 哈啰 echo 1
      match: '^https:\/\/resource\.51downapp\.cn\/f414fbc17c411b4e986ba8891c738a49\.json\?(?:[^#]*&)?md5=e5230c919f7e3f3af3256161fbfaa0e2&(?:[^#]*&)?hbe_qx_ui=1\.3$'
      script_url: https://raw.githubusercontent.com/shengrui123/Egern-YouTube-Plugin/main/scripts/hellobike.response.js
      env:
        stage: echo
      body_required: true
      max_size: 4194304
      timeout: 15
      update_interval: 86400
  - http_response:
      name: 哈啰 response 2
      match: '^https:\/\/api\.hellobike\.com(?::443)?\/secretkey(?:\?|$)'
      script_url: https://raw.githubusercontent.com/shengrui123/Egern-YouTube-Plugin/main/scripts/hellobike.response.js
      env:
        stage: response
      body_required: true
      max_size: 4194304
      timeout: 15
      update_interval: 86400
  - http_request:
      name: 哈啰 request 3
      match: '^https?:\/\/(?:api|marketingapi|entertainment)\.hellobike\.com(?::\d+)?\/api(?:\?|$)'
      script_url: https://raw.githubusercontent.com/shengrui123/Egern-YouTube-Plugin/main/scripts/hellobike.response.js
      env:
        stage: request
      body_required: true
      max_size: 4194304
      timeout: 15
      update_interval: 86400
  - http_response:
      name: 哈啰 response 4
      match: '^https?:\/\/(?:api|marketingapi|entertainment)\.hellobike\.com(?::\d+)?\/api(?:\?|$)'
      script_url: https://raw.githubusercontent.com/shengrui123/Egern-YouTube-Plugin/main/scripts/hellobike.response.js
      env:
        stage: response
      body_required: true
      max_size: 4194304
      timeout: 15
      update_interval: 86400
  - http_response:
      name: 哈啰 response 5
      match: '^https:\/\/taxiapi\.hellobike\.com(?::443)?\/api(?:\?|$)'
      script_url: https://raw.githubusercontent.com/shengrui123/Egern-YouTube-Plugin/main/scripts/hellobike.response.js
      env:
        stage: response
      body_required: true
      max_size: 4194304
      timeout: 15
      update_interval: 86400
mitm:
  hostnames:
    includes:
      - api.hellobike.com
      - taxiapi.hellobike.com
      - marketingapi.hellobike.com
      - entertainment.hellobike.com
      - api-htp.beizi.biz
      - adservice.sigmob.cn
      - tm.sigmob.cn
      - mi.gdt.qq.com
      - v2mi.gdt.qq.com
      - resource.51downapp.cn
