name: Telegram 短链重定向
description: 适用于安装了多个不同 Telegram 客户端的用户，用于在指定客户端中打开公开或私有群组及频道的 Telegram 短链。
author: shengrui123
homepage: https://github.com/shengrui123/Egern-YouTube-Plugin
icon: paperplane.fill

env_schema:
  CLIENT:
    name: 客户端
    description: 指定跳转的客户端
    default_value: tg
    options:
      - tg
      - sg

scriptings:
  - http_request:
      name: Telegram 短链客户端重定向
      match: '^https?://(?:www\.)?(?:t\.me|telegram\.me|telegram\.dog)/'
      script_url: https://raw.githubusercontent.com/shengrui123/Egern-YouTube-Plugin/main/scripts/telegram.redirect.request.js
      timeout: 5

mitm:
  hostnames:
    includes:
      - t.me
      - telegram.me
      - telegram.dog
