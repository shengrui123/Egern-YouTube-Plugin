name: Spotify 去广告与界面修复
description: >-
  过滤已知广告投放域名和播放中的音视频广告素材，并尝试解除随机播放与点播限制；实际效果取决于 Spotify 服务端。
author: 001ProMax（原插件）；shengrui123（Egern 安全适配）
homepage: https://github.com/shengrui123/Egern-YouTube-Plugin
open_url: https://apps.apple.com/app/id324684580
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Spotify.png

compat_arguments:
  SCRIPT_BASE: https://raw.githubusercontent.com/shengrui123/Egern-YouTube-Plugin/main/scripts
compat_arguments_desc: SCRIPT_BASE 为配套脚本目录，无末尾斜杠；可使用本地目录或 HTTPS 地址。

# default_value 只作为设置页占位提示；配套脚本内另有相同的默认值。
env_schema:
  experimentalPlayback:
    name: 嘗試任意選歌與關閉強制隨機
    description: 實驗性修改播放配置；不保證解除服務端限制，修改後可能需要重新登入。
    default_value: 'true'
    options: ['true', 'false']
  removeCreateTab:
    name: 移除底栏创建按钮
    description: 修改后需要重新登录 Spotify 才可能生效。
    default_value: 'false'
    options: ['true', 'false']
  userActivity:
    name: 启用 Apple 设备接力
    description: 修改后需要重新登录 Spotify 才可能生效。
    default_value: 'true'
    options: ['true', 'false']

rules:
  # 精确匹配广告投放和插播素材主机，避免拦截通用音乐 CDN。
  - domain:
      match: ad.audio-ak.cdn.spotify.com
      policy: REJECT
  - domain:
      match: ad.video-ak.cdn.spotify.com
      policy: REJECT
  - domain:
      match: ads-akp.spotify.com
      policy: REJECT
  - domain:
      match: ads-fa.spotify.com
      policy: REJECT
  - domain:
      match: ads-sp-lon.cdn.spotify.com
      policy: REJECT
  - domain:
      match: ads-fa.spotify.ads.pubmatic.com
      policy: REJECT
  - domain:
      match: audio-ads.spotify.com
      policy: REJECT
  - domain:
      match: mp3ad.scdn.co
      policy: REJECT
  - domain:
      match: adstudio-assets.scdn.co
      policy: REJECT
  # 强制 Spotify 回退到可被 HTTPS 解密处理的 TCP 连接。
  - and:
      match:
        - domain_suffix:
            match: spotify.com
        - protocol:
            match: quic
      policy: REJECT

url_rewrites:
  - match: '^https://(?:[\w-]+-spclient|spclient\.wg)\.spotify\.com(?::443)?/pendragon/(?:.*)?$'
    location: http://reject-dict/
  # 保留原主机及所有查询参数，调整歌手和专辑页面的平台参数。
  - match: '^(https://(?:[\w-]+-spclient|spclient\.wg)\.spotify\.com(?::443)?/(?:artistview/v1/artist|album-entity-view/v2/album)/[^?]*\?(?:[^&]*&)*?)platform=iphone(&.*|$)$'
    location: '$1platform=ipad$2'

scriptings:
  - http_response:
      name: Spotify 广告与界面配置
      match: '^https://(?:[\w-]+-spclient|spclient\.wg)\.spotify\.com(?::443)?/(?:bootstrap|user-customization-service)(?:[/?].*)?$'
      script_url: '{{{SCRIPT_BASE}}}/spotify.response.js'
      body_required: true
      binary_body: true
      max_size: 10485760
      timeout: 10

mitm:
  hostnames:
    includes:
      - '*-spclient.spotify.com'
      - spclient.wg.spotify.com
